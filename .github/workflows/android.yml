name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build NEXORA debug APK
        run: gradle -p apps/nexora-android assembleDebug
      - name: Build MIRO debug APK
        run: gradle -p apps/miro-android assembleDebug
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexora-miro-debug-apks
          path: |
            apps/nexora-android/app/build/outputs/apk/debug/*.apk
            apps/miro-android/app/build/outputs/apk/debug/*.apk
