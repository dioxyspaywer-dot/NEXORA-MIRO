name: Build Nexora & MIRO
on:
  push:
    branches: [main]
jobs:
  build-server-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd server && zip -r ../server.zip . -x node_modules/\* .env dist/\*
      - uses: actions/upload-artifact@v4
        with: { name: server-source, path: server.zip }
  build-nexora-apk:
    runs-on: ubuntu-latest
    needs: build-server-zip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.19.0' }
      - run: |
          cd nexora
          flutter pub get
          flutter build apk --release --dart-define=API_URL=${{ secrets.API_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: nexora-apk, path: nexora/build/app/outputs/flutter-apk/app-release.apk }
  build-miro-apk:
    runs-on: ubuntu-latest
    needs: build-server-zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: |
          cd miro
          chmod +x gradlew
          ./gradlew assembleRelease -PapiUrl=${{ secrets.API_URL }}
      - uses: actions/upload-artifact@v4
        with: { name: miro-apk, path: miro/app/build/outputs/apk/release/app-release-unsigned.apk }
