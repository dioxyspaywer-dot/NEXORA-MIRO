name: Build Nexora & MIRO
on:
  push:
    branches: [main]

jobs:
  build-server-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cd server && zip -r ../server.zip . -x node_modules/\* .env dist/\*
      - uses: actions/upload-artifact@v4
        with: 
          name: server-source
          path: server.zip

  build-nexora-apk:
    runs-on: ubuntu-latest
    needs: build-server-zip
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: 
          flutter-version: '3.19.0'
      - run: |
          cd nexora
          flutter pub get
          # Compilation en mode DEBUG (signé automatiquement)
          flutter build apk --debug --dart-define=API_URL=${{ secrets.API_URL }}
      - uses: actions/upload-artifact@v4
        with: 
          name: nexora-apk
          # Chemin mis à jour pour l'APK debug
          path: nexora/build/app/outputs/flutter-apk/app-debug.apk

  build-miro-apk:
    runs-on: ubuntu-latest
    needs: build-server-zip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: 
          distribution: temurin
          java-version: '17'
      - run: |
          cd miro
          chmod +x gradlew
          # Compilation en mode DEBUG (signé automatiquement)
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: 
          name: miro-apk
          # Chemin mis à jour pour l'APK debug
          path: miro/app/build/outputs/apk/debug/app-debug.apk